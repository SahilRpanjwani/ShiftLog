{% extends "base.html" %}
{% block title %}Upload Document — ShiftLog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h4 class="mb-4">Upload Document</h4>
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Select File</label>
                        <input type="file" name="file" class="form-control" accept=".jpg,.jpeg,.png,.pdf" required>
                        <div class="form-text">Accepted: JPG, PNG, PDF — max 10MB</div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Upload & Extract</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
