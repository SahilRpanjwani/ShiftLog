{% if fc %}
    {% with pct=fc.confidence|stringformat:"f" %}
    {% if fc.confidence >= 0.8 %}
        <span class="badge bg-success">{% widthratio fc.confidence 1 100 %}%</span>
    {% elif fc.confidence >= 0.6 %}
        <span class="badge bg-warning text-dark">{% widthratio fc.confidence 1 100 %}%</span>
    {% else %}
        <span class="badge bg-danger">{% widthratio fc.confidence 1 100 %}%</span>
    {% endif %}
    {% endwith %}
{% endif %}
