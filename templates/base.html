<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShiftLog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .confidence-high { color: #198754; font-weight: 600; }
        .confidence-mid  { color: #fd7e14; font-weight: 600; }
        .confidence-low  { color: #dc3545; font-weight: 600; }
        .field-uncertain input, .field-uncertain select { border-color: #dc3545; }
        .field-error small { color: #dc3545; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard:dashboard' %}">⚙ ShiftLog</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link text-white" href="{% url 'dashboard:dashboard' %}">Dashboard</a>
            <a class="nav-link text-white" href="{% url 'documents:upload' %}">Upload</a>
            <a class="nav-link text-white" href="{% url 'documents:document_list' %}">History</a>
            <a class="nav-link text-white" href="{% url 'dashboard:record_search' %}">Search</a>
        </div>
    </div>
</nav>

<div class="container mb-5">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
